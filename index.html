<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>두근두근 주사위 폭탄</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf2ff;color:#192a47;font-family:system-ui,'Malgun Gothic',sans-serif}main{height:100dvh;max-width:1500px;margin:auto;padding:20px;display:flex;flex-direction:column;gap:16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:clamp(24px,3vw,40px)}button,input{font:inherit;border:2px solid #c9d8f1;border-radius:16px;padding:12px;background:white;color:#192a47}button{cursor:pointer;font-weight:850}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:4px solid #ffb529}.layout{display:grid;grid-template-columns:260px 1fr 270px;gap:18px;flex:1;min-height:0}.panel,.board{border:2px solid #d5e2f7;background:white;border-radius:26px;padding:20px}.panel{display:flex;flex-direction:column;gap:14px}h2{margin:0;font-size:22px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.selected{background:#dce7ff;border-color:#315cf5;color:#2248ce}.primary{background:#315cf5;border-color:#315cf5;color:white}#start{font-size:25px;padding:20px 10px;background:#ffcb43;border-color:#eab32c;color:#3e2c00;box-shadow:0 5px 0 #dda225}label{display:flex;align-items:center;justify-content:space-between;gap:8px}input{width:92px;font-size:22px;font-weight:800}.instructions{margin:0;padding-left:22px;line-height:1.9;font-size:16px}.tip{background:#eef4ff;border-radius:14px;padding:12px;line-height:1.6;margin:0}.board{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:12px;overflow:hidden}.players{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}.player{border:3px solid transparent;background:#edf2fc;border-radius:14px;padding:10px;font-weight:800;font-size:clamp(15px,1.4vw,21px)}.active{background:#dce8ff;border-color:#315cf5}.lost{background:#ffe1da;border-color:#ed483a}.bomb{--red:30;--green:48;--blue:75;position:relative;flex-shrink:0;width:clamp(180px,25vh,310px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 50%),rgb(var(--red),var(--green),var(--blue));box-shadow:0 12px 0 #d9e2ef;display:flex;flex-direction:column;justify-content:center;color:white;transition:background-color .1s}.bomb:before{content:'🔥';position:absolute;top:-45px;right:10px;font-size:54px}.total{font-size:clamp(75px,12vh,135px);font-weight:950;line-height:1.1}.meter{height:18px;width:90%;background:#eaf0f8;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:#31b795}.message{font-size:clamp(20px,2vw,30px);font-weight:900;margin:0;min-height:2.5em;display:flex;align-items:center;justify-content:center}.rule{margin:0;font-size:20px;color:#526580}.tap{flex:1;min-height:130px;max-height:290px;background:#ffede6;border:3px solid #ff9b79;color:#b83920;font-size:clamp(28px,3vw,46px);box-shadow:0 6px 0 #efa588}.tap span{display:block;font-size:65px}.turn-count{background:#eef4ff;padding:15px;border-radius:18px;text-align:center}.turn-count strong{display:block;font-size:50px;color:#315cf5}.next{font-size:23px;padding:20px 8px}.exploded .bomb{background:#ffcb3e!important;color:#ae291d;animation:pop .4s}.exploded .bomb:before{content:'💥';font-size:100px;top:-25px;right:-15px}@keyframes pop{50%{transform:scale(1.08) rotate(5deg)}}dialog{border:0;border-radius:24px;padding:26px;max-width:600px;line-height:1.8}dialog::backdrop{background:#172a4777}pre{white-space:pre-wrap;background:#edf3fc;padding:16px;border-radius:14px}.header-buttons{display:flex;gap:8px}@media(max-height:680px) and (min-width:901px){main{padding:10px;gap:10px}.panel,.board{padding:14px}.panel{gap:10px}.instructions{line-height:1.6}#start{padding:14px}.bomb{width:180px}.total{font-size:80px}.tap span{font-size:45px}.turn-count{padding:8px}.turn-count strong{font-size:34px}.next{padding:14px}}@media(max-width:1050px){.layout{grid-template-columns:210px 1fr 220px;gap:10px}.panel,.board{padding:14px}}@media(max-width:800px){main{height:auto;min-height:100dvh;padding:12px}.layout{grid-template-columns:1fr 1fr}.board{grid-column:1/-1;grid-row:1;min-height:400px}.panel{gap:10px}header{flex-wrap:wrap}.bomb{width:200px}.message{font-size:22px}.tap{min-height:130px}}

.board{position:relative;overflow:visible;isolation:isolate}.bomb{width:clamp(210px,32vh,350px);transform:scale(var(--inflate,1));transition:transform .18s ease-out,background .15s;z-index:2}.players,.rule,.message,.meter{position:relative;z-index:3}.exploded .bomb{animation:none;transform:scale(1);transition:transform .35s}.blast{position:fixed;inset:0;z-index:100;pointer-events:none;display:grid;place-items:center;overflow:hidden;opacity:0;visibility:hidden}.blast.play{visibility:visible;animation:blastBackdrop 1.65s ease-out forwards}.blast-core{width:85vmin;height:85vmin;display:grid;place-items:center;position:relative;background:radial-gradient(circle,#fffbd0 0 12%,#ffe457 26%,#ff941b 43%,#f74725 57%,transparent 70%);filter:drop-shadow(0 0 45px #ff8629)}.blast.play .blast-core{animation:burst 1.65s ease-out forwards}.blast-symbol{font-size:70vmin;line-height:1}.blast-word{position:absolute;color:white;font-size:clamp(70px,14vw,190px);font-weight:1000;text-shadow:5px 7px 0 #be2816;transform:rotate(-10deg)}@keyframes burst{0%{transform:scale(.15);opacity:0}18%{transform:scale(1.2);opacity:1}45%{transform:scale(1.08);opacity:1}75%{transform:scale(.7);opacity:.8}100%{transform:scale(.15);opacity:0}}@keyframes blastBackdrop{0%{opacity:0;background:#ffb02c00}15%{opacity:1;background:#ffb02c85}40%{opacity:1;background:#ff512c55}100%{opacity:0;background:transparent}}@media(max-height:680px) and (min-width:901px){.bomb{width:210px}}@media(max-width:800px){.bomb{width:230px}.board{min-height:480px}}@media(prefers-reduced-motion:reduce){.bomb{transition:none}.blast.play .blast-core{animation:none;transform:scale(1)}.blast.play{animation:blastBackdrop 1.65s forwards}}
.scorebox{background:#f0f5ff;padding:14px;border-radius:18px;display:flex;flex-direction:column;gap:10px}.score-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:18px}.score-row strong{color:#315cf5;font-size:27px}#scoreline{margin:0;text-align:center;font-size:30px;font-weight:950;color:#244bc9}#clearScores{font-size:15px;padding:8px}.winner{background:#fff1b5;border-color:#e9b32a} </style><main><header><h1>💣 두근두근 주사위 폭탄</h1><div class="header-buttons"><button id="full">전체 화면</button></div></header><div class="layout"><aside class="panel"><h2>게임 준비</h2><div class="choices"><button id="two" class="selected" aria-pressed="true">2인용</button><button id="three" aria-pressed="false">3인용</button></div><label>폭탄 숫자 <input id="target" type="number" value="31" min="7" max="999"></label><button id="start">▶ 게임 시작</button><button id="sound">🔊 소리 ON</button><div class="scorebox"><h2>🏆 누적 승수</h2><div id="scores"></div><p id="scoreline"></p><button id="clearScores">점수 초기화</button></div></aside><section id="board" class="board"><div id="players" class="players"></div><p id="rule" class="rule">31이 되면 폭탄이 터져요!</p><div id="bomb" class="bomb"><span>누적 합계</span><div id="total" class="total">0</div></div><div class="meter"><div id="fill" class="fill"></div></div><p id="message" class="message" aria-live="polite">왼쪽에서 게임 시작을 눌러 주세요</p></section><aside class="panel"><h2 id="current">1번 플레이어</h2><div class="turn-count">이번 차례 클릭 횟수<strong id="clicks">0</strong></div><button id="tap" class="tap" disabled><span>☝️ +1</span>여기를 클릭!</button><button id="next" class="primary next" disabled>다음 사람 →</button><p class="tip">주사위 숫자만큼 클릭한 후 차례를 넘겨 주세요.<br>한 차례에 최대 6번!</p></aside></div></main><div id="blast" class="blast" aria-hidden="true"><div class="blast-core"><div class="blast-symbol">💥</div><div class="blast-word">펑!</div></div></div><script>
const $=id=>document.getElementById(id);let count=2,target=31,total=0,turn=0,clicks=0,playing=false,sound=true,ctx;
let blastTimer;let scores=[0,0,0];function showScores(){$('scores').replaceChildren();for(let i=0;i<count;i++){const row=document.createElement('div');row.className='score-row';const name=document.createElement('span');name.textContent=(i+1)+'번 플레이어';const value=document.createElement('strong');value.textContent=scores[i]+'승';row.append(name,value);$('scores').append(row)}$('scoreline').textContent=scores.slice(0,count).join(' : ')}
function tone(boom=false){if(!sound)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();const now=ctx.currentTime;if(boom){const master=ctx.createGain();master.gain.value=.8;const compressor=ctx.createDynamicsCompressor();master.connect(compressor);compressor.connect(ctx.destination);const buffer=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*1.25),ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);const noise=ctx.createBufferSource();noise.buffer=buffer;const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.setValueAtTime(6500,now);filter.frequency.exponentialRampToValueAtTime(150,now+1.2);noise.connect(filter);filter.connect(master);noise.start(now);const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(150,now);o.frequency.exponentialRampToValueAtTime(28,now+.65);g.gain.setValueAtTime(.9,now);g.gain.exponentialRampToValueAtTime(.001,now+1);o.connect(g);g.connect(master);o.start(now);o.stop(now+1.1)}else{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(500+total*12,now);o.frequency.exponentialRampToValueAtTime(300,now+.13);g.gain.setValueAtTime(.13,now);g.gain.exponentialRampToValueAtTime(.001,now+.2);o.start();o.stop(now+.2)}}catch{}}
function explode(){clearTimeout(blastTimer);$('blast').classList.remove('play');void $('blast').offsetWidth;$('blast').classList.add('play');blastTimer=setTimeout(()=>$('blast').classList.remove('play'),1700)}
function render(lost=false){$('players').replaceChildren();for(let i=0;i<count;i++){const e=document.createElement('div');e.className='player'+(lost?(i===turn?' lost':' winner'):(i===turn?' active':''));e.textContent=(i+1)+'번 플레이어'+(lost?(i===turn?' 💥':' 🏆'):(i===turn?' 👈':''));$('players').append(e)}$('current').textContent=(turn+1)+'번 플레이어';$('total').textContent=total;$('clicks').textContent=clicks;$('tap').disabled=!playing||clicks>=6;$('next').disabled=!playing||clicks===0;const r=Math.min(1,total/target);$('bomb').style.setProperty('--red',Math.round(30+210*r));$('bomb').style.setProperty('--green',Math.round(48-18*r));$('bomb').style.setProperty('--blue',Math.round(75-45*r));$('bomb').style.setProperty('--inflate',lost?1:1+r*.42);$('fill').style.width=r*100+'%';$('fill').style.background='hsl('+Math.round(155*(1-r))+',75%,48%)';$('rule').textContent=target+'이 되면 폭탄이 터져요!'}
function reset(){clearTimeout(blastTimer);$('blast').classList.remove('play');total=0;turn=0;clicks=0;playing=false;$('board').className='board';$('start').textContent='▶ 게임 시작';$('message').textContent='왼쪽에서 게임 시작을 눌러 주세요';render()}
function choose(n){if(count!==n)scores=[0,0,0];count=n;showScores();$('two').classList.toggle('selected',n===2);$('three').classList.toggle('selected',n===3);$('two').setAttribute('aria-pressed',n===2);$('three').setAttribute('aria-pressed',n===3);reset()}
function start(){const n=Number($('target').value);if(!Number.isInteger(n)||n<7||n>999){alert('폭탄 숫자를 7~999 사이 정수로 입력해 주세요.');return}target=n;reset();playing=true;$('start').textContent='↻ 처음부터 다시';$('message').textContent='1번 플레이어, 주사위 숫자만큼 클릭하세요!';render()}
function tap(){if(!playing||clicks>=6)return;total++;clicks++;if(total>=target){playing=false;$('board').className='board exploded';const winners=[];for(let i=0;i<count;i++){if(i!==turn){scores[i]++;winners.push((i+1)+'번')}}showScores();$('message').textContent='펑! '+(turn+1)+'번 패배 · '+winners.join(' · ')+' 플레이어 승리!';$('start').textContent='▶ 다시 한 판!';tone(true);render(true);explode()}else{$('message').textContent=clicks===6?'6번 클릭 완료! 다음 사람을 눌러 주세요.':(turn+1)+'번 플레이어: '+clicks+'번 클릭!';tone();render()}}
function next(){if(!playing||clicks===0)return;turn=(turn+1)%count;clicks=0;$('message').textContent=(turn+1)+'번 플레이어, 주사위를 굴려 주세요!';render()}
$('clearScores').onclick=()=>{scores=[0,0,0];showScores()};$('two').onclick=()=>choose(2);$('three').onclick=()=>choose(3);$('target').onchange=()=>{const n=Number($('target').value);if(Number.isInteger(n)&&n>=7&&n<=999){target=n;reset()}};$('start').onclick=start;$('tap').onclick=tap;$('next').onclick=next;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 소리 ON':'🔇 소리 OFF';tone()};$('full').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}};render();showScores();
</script></html>
